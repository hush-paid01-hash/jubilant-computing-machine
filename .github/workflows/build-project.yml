name: Universal Project Runner

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Public GitHub repository (owner/name)
        required: true
        default: hush-paid01-hash/jubilant-computing-machine
        type: string
      ref:
        description: Branch, tag, or commit
        required: false
        default: main
        type: string
      scheme:
        description: Xcode scheme (optional; auto-detected when blank)
        required: false
        type: string
      action:
        description: Build an iOS app or build/test a Swift package
        required: true
        default: auto
        type: choice
        options:
          - auto
          - ios
          - swift-package

permissions:
  contents: read

jobs:
  run-project:
    runs-on: macos-15
    steps:
      - name: Validate repository input
        env:
          TARGET_REPOSITORY: ${{ inputs.repository }}
        run: |
          if [[ ! "$TARGET_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Repository must be owner/name for a public GitHub repository."
            exit 1
          fi

      - name: Checkout selected project
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          path: project

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Detect project type
        id: detect
        env:
          REQUESTED_ACTION: ${{ inputs.action }}
        run: |
          cd project
          WORKSPACE=$(find . -maxdepth 5 -name '*.xcworkspace' -not -path '*/Pods/*' | head -n 1)
          PROJECT=$(find . -maxdepth 5 -name '*.xcodeproj' -not -path '*/Pods/*' | head -n 1)
          PACKAGE=$(find . -maxdepth 5 -name 'Package.swift' -not -path '*/.build/*' | head -n 1)

          if [ "$REQUESTED_ACTION" = "swift-package" ]; then
            [ -n "$PACKAGE" ] || { echo "::error::No Package.swift found."; exit 1; }
            echo "kind=package" >> "$GITHUB_OUTPUT"
            echo "package_path=$(dirname "$PACKAGE")" >> "$GITHUB_OUTPUT"
          elif [ "$REQUESTED_ACTION" = "ios" ] || [ -n "$WORKSPACE" ] || [ -n "$PROJECT" ]; then
            [ -n "$WORKSPACE" ] || [ -n "$PROJECT" ] || { echo "::error::No Xcode project/workspace found for iOS build."; exit 1; }
            if [ -n "$WORKSPACE" ]; then
              echo "container=-workspace" >> "$GITHUB_OUTPUT"
              echo "project_path=$WORKSPACE" >> "$GITHUB_OUTPUT"
              LIST=$(xcodebuild -list -json -workspace "$WORKSPACE")
            else
              echo "container=-project" >> "$GITHUB_OUTPUT"
              echo "project_path=$PROJECT" >> "$GITHUB_OUTPUT"
              LIST=$(xcodebuild -list -json -project "$PROJECT")
            fi
            SCHEME="${{ inputs.scheme }}"
            if [ -z "$SCHEME" ]; then
              SCHEME=$(printf '%s' "$LIST" | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("workspace",{}).get("schemes") or d.get("project",{}).get("schemes") or [""])[0])')
            fi
            [ -n "$SCHEME" ] || { echo "::error::No scheme found. Enter an Xcode scheme."; exit 1; }
            echo "kind=ios" >> "$GITHUB_OUTPUT"
            echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          elif [ -n "$PACKAGE" ]; then
            echo "kind=package" >> "$GITHUB_OUTPUT"
            echo "package_path=$(dirname "$PACKAGE")" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No supported Xcode project or Swift package found."
            exit 1
          fi

      - name: Build and test Swift package
        if: steps.detect.outputs.kind == 'package'
        working-directory: project/${{ steps.detect.outputs.package_path }}
        run: |
          swift package resolve
          swift test
          swift build -c release
          mkdir -p "$GITHUB_WORKSPACE/runner-artifacts"
          # Archive the complete Release output. Do not assume the user's
          # package has a particular executable or product name.
          test -d .build/release || { echo "::error::SwiftPM did not produce a Release directory."; exit 1; }
          tar -czf "$GITHUB_WORKSPACE/runner-artifacts/swift-package-build.tar.gz" -C .build/release .
          test -s "$GITHUB_WORKSPACE/runner-artifacts/swift-package-build.tar.gz"
          tar -tzf "$GITHUB_WORKSPACE/runner-artifacts/swift-package-build.tar.gz"

      - name: Build iOS device app with Xcode
        if: steps.detect.outputs.kind == 'ios'
        working-directory: project
        env:
          CONTAINER_FLAG: ${{ steps.detect.outputs.container }}
          PROJECT_PATH: ${{ steps.detect.outputs.project_path }}
          SCHEME: ${{ steps.detect.outputs.scheme }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/runner-artifacts"
          if [ "$CONTAINER_FLAG" = "-workspace" ]; then
            xcodebuild -workspace "$PROJECT_PATH" -scheme "$SCHEME" -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" CODE_SIGNING_ALLOWED=NO build
          else
            xcodebuild -project "$PROJECT_PATH" -scheme "$SCHEME" -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" CODE_SIGNING_ALLOWED=NO build
          fi
          APP=$(find "$GITHUB_WORKSPACE/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -type d | head -n 1)
          [ -n "$APP" ] || { echo "::error::Xcode did not produce an iOS .app."; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/package/Payload"
          cp -R "$APP" "$GITHUB_WORKSPACE/package/Payload/"
          cd "$GITHUB_WORKSPACE/package"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/runner-artifacts/Project-Unsigned.ipa" Payload
          unzip -t "$GITHUB_WORKSPACE/runner-artifacts/Project-Unsigned.ipa"

      - name: Verify runner artifact output
        run: |
          ls -lah "$GITHUB_WORKSPACE/runner-artifacts"
          test -n "$(find "$GITHUB_WORKSPACE/runner-artifacts" -maxdepth 1 -type f -print -quit)"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.detect.outputs.kind == 'ios' && 'Project-Unsigned-IPA' || 'Swift-Package-Build' }}
          path: ${{ github.workspace }}/runner-artifacts/*
          if-no-files-found: error
          retention-days: 7
