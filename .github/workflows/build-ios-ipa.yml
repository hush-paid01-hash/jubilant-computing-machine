name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for physical iOS devices (unsigned)
        run: |
          xcodebuild \
            -project IOSStarter.xcodeproj \
            -scheme IOSStarter \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p build/package/Payload build/artifacts
          cp -R build/DerivedData/Build/Products/Release-iphoneos/IOSStarter.app build/package/Payload/
          cd build/package
          /usr/bin/zip -qry ../artifacts/IOSStarter-Unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: IOSStarter-Unsigned-IPA
          path: build/artifacts/IOSStarter-Unsigned.ipa
          if-no-files-found: error
          retention-days: 7
