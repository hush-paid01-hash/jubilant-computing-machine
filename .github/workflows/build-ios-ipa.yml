name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode and Swift compiler versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install build tools
        run: brew install xcodegen cairo

      - name: Render app icon
        run: |
          python3 -m venv .venv
          .venv/bin/pip install cairosvg
          .venv/bin/python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='Assets/AppIcon.svg', write_to='Assets.xcassets/AppIcon.appiconset/AppIcon.png', output_width=1024, output_height=1024)
          cairosvg.svg2png(url='Assets/AppIcon.svg', write_to='Assets.xcassets/StarterMark.imageset/StarterMark.png', output_width=256, output_height=256)
          PY

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for physical iOS devices (unsigned)
        run: |
          xcodebuild \
            -project IOSStarter.xcodeproj \
            -scheme IOSStarter \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p build/package/Payload build/artifacts
          cp -R build/DerivedData/Build/Products/Release-iphoneos/IOSStarter.app build/package/Payload/
          cd build/package
          /usr/bin/zip -qry ../artifacts/IOSStarter-Unsigned.ipa Payload

      - name: Verify packaged IPA
        run: |
          IPA="build/artifacts/IOSStarter-Unsigned.ipa"
          test -s "$IPA"
          unzip -t "$IPA"
          APP_PLIST="build/package/Payload/IOSStarter.app/Info.plist"
          test -f "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PLIST"
          echo "Unsigned IPA package verification passed. Device installation and signing must still be tested separately."

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: IOSStarter-Unsigned-IPA
          path: build/artifacts/IOSStarter-Unsigned.ipa
          if-no-files-found: error
          retention-days: 7
